  <h1>Notiz hochladen</h1>
<form action="/upload" method="POST" enctype="multipart/form-data">
  <label>Titel:</label>
  <input type="text" name="title" required><br>

  <label>Hochgeladen von:</label>
  <input type="text" name="uploader" required><br>

 <label>Kurs / Kategorie:</label>
  <select name="category" required>
    <option value="">Alle</option>
    <option value="mathe">Mathe</option>
    <option value="programmieren">Programmieren</option>
    <option value="grundlagenIT">Grundlagen IT</option>
    <option value="softwareengineering">Softwareengineering</option>
    <option value="bwl">BWL</option>
    <option value="recht">Recht</option>
    <option value="mckinsey">McKinsey</option>
  </select><br>

  <label>Datei:</label>
  <input type="file" name="noteFile" required><br><br>
  <button type="submit">Hochladen</button>

</form>
  <p><a href="/">Zurück zu den vorhanden Notizen</a></p>
